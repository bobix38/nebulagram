<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NebulaGram — шуточный клон Telegram</title>
<style>
:root{
  --bg:#0e1621; --panel:#17212b; --panel2:#1e2a37; --divider:#232f3d;
  --text:#e8eef5; --text2:#8ea0b3; --accent:#4ea4f5; --accent2:#3d8fd9;
  --bubble-out:#2b5f8a; --bubble-in:#1e2a37; --danger:#ef5959; --ok:#4fd18b; --star:#ffcf4a;
}
body.light{
  --bg:#f4f6f8; --panel:#ffffff; --panel2:#eef2f5; --divider:#e2e6ea;
  --text:#0e1621; --text2:#6b7a89; --accent:#3d8fd9; --accent2:#2f74b8;
  --bubble-out:#dcf0ff; --bubble-in:#ffffff; --danger:#d43f3f; --ok:#2fa870;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0; background:#05070a; color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; display:flex; align-items:flex-start; justify-content:center; min-height:100%; padding:10px;}
#phone{width:100%; max-width:410px; height:min(890px,96vh); background:var(--bg); border-radius:34px; overflow:hidden; position:relative; box-shadow:0 30px 70px rgba(0,0,0,.55), 0 0 0 8px #000; display:flex; flex-direction:column;}
#statusbar{flex:0 0 auto; height:34px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; font-size:13px; font-weight:600; color:var(--text); background:var(--bg); z-index:50;}
#statusbar .right{display:flex; align-items:center; gap:5px; font-size:11px; opacity:.85; font-weight:500;}
#content{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; background:var(--bg); position:relative;}
#content::-webkit-scrollbar{width:0;}
#fabhost{position:absolute; inset:0; pointer-events:none; z-index:15;}
#navslot{flex:0 0 auto;}
.topbar{position:sticky; top:0; z-index:20; background:var(--panel); display:flex; align-items:center; min-height:52px; padding:6px 8px; gap:6px; border-bottom:1px solid var(--divider);}
.topbar .back{font-size:22px; padding:6px 8px; cursor:pointer; color:var(--accent); flex:0 0 auto;}
.topbar .title{font-size:17px; font-weight:700; flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.topbar .sub{font-size:12px; color:var(--text2); font-weight:400; margin-top:1px;}
.topbar .titlewrap{display:flex; flex-direction:column; flex:1 1 auto; min-width:0;}
.topbar .actions{display:flex; gap:14px; padding-right:6px; font-size:20px; flex:0 0 auto;}
.iconbtn{cursor:pointer; user-select:none;}
.bottomnav{display:flex; align-items:center; justify-content:space-around; background:var(--panel); border-top:1px solid var(--divider); padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
.navitem{display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--text2); font-size:10px; cursor:pointer; padding:4px 10px; border-radius:12px; position:relative;}
.navitem.active{color:var(--accent);}
.navitem .navicon{font-size:22px; line-height:1;}
.navitem .navavatar{width:24px; height:24px; border-radius:50%; overflow:hidden;}
.navitem .navavatar img{width:100%; height:100%; object-fit:cover;}
.navbadge{position:absolute; top:-2px; right:2px; background:var(--danger); color:#fff; font-size:9px; font-weight:700; border-radius:8px; min-width:15px; height:15px; display:flex; align-items:center; justify-content:center; padding:0 3px;}
.center-flow{display:flex; flex-direction:column; align-items:center; padding:50px 26px 30px; text-align:center; min-height:100%;}
.hero-emoji{font-size:64px; margin-bottom:18px;}
.flow-title{font-size:22px; font-weight:700; margin-bottom:8px;}
.flow-sub{font-size:14px; color:var(--text2); line-height:1.5; margin-bottom:22px; max-width:300px;}
.field-row{width:100%; display:flex; align-items:center; background:var(--panel2); border:1px solid var(--divider); border-radius:12px; padding:12px 14px; margin-bottom:12px;}
.field-row.focus{border-color:var(--accent);}
.field-row .prefix{color:var(--text2); margin-right:8px; font-size:16px;}
.field-row input{flex:1; background:transparent; border:none; outline:none; color:var(--text); font-size:16px; min-width:0;}
.field-row .chev{color:var(--text2);}
.bigbtn{background:var(--accent); color:#fff; border:none; border-radius:14px; padding:13px 18px; font-size:15px; font-weight:700; cursor:pointer; width:100%;}
.bigbtn.ghost{background:transparent; border:1.5px solid var(--accent); color:var(--accent);}
.bigbtn.danger{background:var(--danger);}
.bigbtn:disabled{opacity:.4;}
.rowbtns{display:flex; gap:10px; width:100%; margin-top:2px;}
.rowbtns .bigbtn{font-size:13px; padding:11px 6px;}
.fab{position:absolute; right:16px; bottom:74px; width:56px; height:56px; border-radius:50%; background:var(--accent); color:#fff; font-size:26px; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,.4); cursor:pointer; pointer-events:auto;}
.codewrap{display:flex; gap:10px; margin-bottom:18px;}
.codebox{width:42px; height:52px; border-radius:10px; background:var(--panel2); border:1.5px solid var(--divider); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700;}
.codebox.filled{border-color:var(--accent);}
.hiddeninput{position:absolute; opacity:0; height:1px; width:1px;}
.avatar-picker{position:relative; width:96px; height:96px; margin-bottom:22px;}
.avatar-picker .av{width:96px; height:96px; border-radius:50%; overflow:hidden; background:var(--panel2); display:flex; align-items:center; justify-content:center; font-size:34px; color:var(--text2);}
.avatar-picker img{width:100%; height:100%; object-fit:cover;}
.avatar-picker .camera{position:absolute; right:0; bottom:0; width:32px; height:32px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px; border:3px solid var(--bg); cursor:pointer;}
.searchbar{padding:8px 12px; background:var(--panel);}
.searchbar input{width:100%; background:var(--panel2); border:none; border-radius:20px; padding:9px 14px; color:var(--text); font-size:14px; outline:none;}
.folderrow{display:flex; gap:6px; padding:8px 10px; overflow-x:auto; background:var(--panel); border-bottom:1px solid var(--divider);}
.folderpill{flex:0 0 auto; padding:7px 14px; border-radius:16px; font-size:13px; font-weight:600; background:var(--panel2); color:var(--text2); cursor:pointer; white-space:nowrap;}
.folderpill.active{background:var(--accent); color:#fff;}
.listitem{display:flex; align-items:center; gap:12px; padding:10px 14px; cursor:pointer; border-bottom:1px solid var(--divider);}
.listitem:active{background:var(--panel2);}
.avatar{width:50px; height:50px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:700; color:#fff; overflow:hidden; position:relative;}
.avatar img{width:100%; height:100%; object-fit:cover;}
.avatar .badgeicon{position:absolute; right:-2px; bottom:-2px; font-size:14px; background:var(--panel); border-radius:50%; padding:1px;}
.li-mid{flex:1 1 auto; min-width:0;}
.li-top{display:flex; justify-content:space-between; align-items:baseline; gap:6px;}
.li-name{font-size:15.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.li-name.deleted{color:var(--text2); font-style:italic; font-weight:500;}
.li-time{font-size:12px; color:var(--text2); flex:0 0 auto;}
.li-bottom{display:flex; justify-content:space-between; align-items:center; gap:6px; margin-top:2px;}
.li-msg{font-size:13.5px; color:var(--text2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.li-unread{background:var(--accent); color:#fff; font-size:11px; font-weight:700; border-radius:10px; min-width:20px; height:20px; padding:0 6px; display:flex; align-items:center; justify-content:center;}
.li-muted{color:var(--text2); font-size:13px;}
.emptystate{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:60px 30px; color:var(--text2);}
.emptystate .em{font-size:70px; margin-bottom:14px;}
.emptystate .t1{font-size:17px; font-weight:700; color:var(--text); margin-bottom:6px;}
.emptystate .t2{font-size:13.5px; line-height:1.5; max-width:260px;}
.messages{padding:12px 10px 10px; display:flex; flex-direction:column;}
.msgrow{display:flex; margin-bottom:6px;}
.msgrow.out{justify-content:flex-end;}
.bubble{max-width:76%; padding:8px 11px 6px; border-radius:16px; font-size:14.5px; line-height:1.35; position:relative; word-wrap:break-word; white-space:pre-wrap;}
.bubble.in{background:var(--bubble-in); border-bottom-left-radius:4px;}
.bubble.out{background:var(--bubble-out); border-bottom-right-radius:4px;}
.bubble .sname{font-size:12px; font-weight:700; color:var(--accent); margin-bottom:2px; display:block;}
.bubble .btime{font-size:10.5px; color:var(--text2); float:right; margin:4px 0 -2px 8px;}
.systemmsg{align-self:center; background:rgba(255,255,255,.06); color:var(--text2); font-size:12px; padding:5px 12px; border-radius:12px; margin:8px auto; max-width:85%; text-align:center;}
.typingind{align-self:flex-start; background:var(--bubble-in); border-radius:16px; padding:9px 13px; font-size:13px; color:var(--text2); margin-bottom:6px;}
.inputbar{position:sticky; bottom:0; display:flex; align-items:flex-end; gap:8px; padding:8px 10px; background:var(--panel); border-top:1px solid var(--divider); z-index:10;}
.inputbar textarea{flex:1; background:var(--panel2); border:none; border-radius:18px; padding:10px 14px; color:var(--text); font-size:14.5px; resize:none; outline:none; max-height:100px; font-family:inherit;}
.sendbtn{width:38px; height:38px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; flex:0 0 auto;}
.profilehead{display:flex; flex-direction:column; align-items:center; padding:28px 20px 18px; text-align:center;}
.profilehead .pname{font-size:20px; font-weight:700; margin-top:12px;}
.profilehead .psub{font-size:13.5px; color:var(--text2); margin-top:3px;}
.actionrow{display:flex; justify-content:center; gap:10px; padding:6px 16px 18px; flex-wrap:wrap;}
.actionchip{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:var(--accent); cursor:pointer; width:64px;}
.actionchip .aic{width:46px; height:46px; border-radius:50%; background:var(--panel2); display:flex; align-items:center; justify-content:center; font-size:19px; color:var(--accent);}
.section{background:var(--panel); margin:10px; border-radius:14px; overflow:hidden;}
.section .h{padding:8px 14px 4px; font-size:12.5px; color:var(--accent); font-weight:600;}
.row{display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--divider); cursor:pointer;}
.row:last-child{border-bottom:none;}
.row .ric{font-size:20px; width:26px; display:flex; align-items:center; justify-content:center; color:var(--accent); flex:0 0 auto;}
.row.danger .ric{color:var(--danger);}
.row .rtxt{flex:1 1 auto; min-width:0;}
.row .rmain{font-size:15px;}
.row .rsub{font-size:12.5px; color:var(--text2); margin-top:2px;}
.row.danger .rmain{color:var(--danger);}
.row .chev{color:var(--text2); font-size:18px;}
.switch{position:relative; width:44px; height:26px; border-radius:14px; background:var(--divider); flex:0 0 auto; cursor:pointer; transition:.15s;}
.switch.on{background:var(--accent);}
.switch .knob{position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:#fff; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.4);}
.switch.on .knob{left:20px;}
.textinput{width:100%; background:var(--panel2); border:1px solid var(--divider); border-radius:10px; padding:10px 12px; color:var(--text); font-size:14.5px; outline:none; font-family:inherit;}
textarea.textinput{resize:vertical; min-height:70px;}
.formlabel{font-size:12.5px; color:var(--text2); margin:14px 10px 6px;}
.hint{font-size:12px; color:var(--text2); padding:10px 16px 16px; line-height:1.5;}
.sheet-backdrop{position:absolute; inset:0; background:rgba(0,0,0,.5); z-index:100; display:flex; align-items:flex-end;}
.sheet{width:100%; background:var(--panel); border-radius:18px 18px 0 0; padding:6px 0 calc(6px + env(safe-area-inset-bottom)); animation:slideup .18s ease-out;}
@keyframes slideup{from{transform:translateY(100%)} to{transform:translateY(0)}}
.sheet .sitem{padding:14px 20px; font-size:16px; cursor:pointer; display:flex; align-items:center; gap:10px;}
.sheet .sitem.danger{color:var(--danger);}
.sheet .sitem:active{background:var(--panel2);}
.sheet .scancel{margin-top:6px; padding:14px 20px; font-size:16px; font-weight:700; text-align:center; color:var(--accent); border-top:6px solid var(--bg); cursor:pointer;}
.modal-backdrop{position:absolute; inset:0; background:rgba(0,0,0,.55); z-index:110; display:flex; align-items:center; justify-content:center; padding:24px;}
.modalbox{width:100%; max-width:320px; background:var(--panel); border-radius:16px; padding:20px; max-height:80%; overflow-y:auto;}
.modalbox .mtitle{font-size:17px; font-weight:700; margin-bottom:8px;}
.modalbox .mbody{font-size:14px; color:var(--text2); line-height:1.5; margin-bottom:16px;}
.modalbox .mrow{display:flex; gap:10px; margin-top:14px;}
.pickitem{display:flex; align-items:center; gap:10px; padding:9px 4px; cursor:pointer; border-radius:8px;}
.pickitem input{width:18px; height:18px;}
.pickitem:active{background:var(--panel2);}
.toast{position:absolute; left:50%; bottom:80px; transform:translateX(-50%); background:#2c2c2e; color:#fff; padding:10px 18px; border-radius:20px; font-size:13.5px; z-index:200; box-shadow:0 4px 14px rgba(0,0,0,.4); max-width:85%; text-align:center;}
.stargame{margin:14px; padding:20px; border-radius:18px; background:linear-gradient(160deg,#2a2038,#1c1730); text-align:center;}
.stargame .sbig{font-size:46px; margin-bottom:4px;}
.starbtn{width:130px; height:130px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#ffe27a,#e0a915); border:none; font-size:44px; color:#7a5300; cursor:pointer; box-shadow:0 8px 24px rgba(224,169,21,.4); margin:14px auto; display:block;}
.starbtn:active{transform:scale(.94);}
.starbtn:disabled{filter:grayscale(1); opacity:.5;}
.energybar{width:100%; height:8px; background:rgba(255,255,255,.12); border-radius:5px; overflow:hidden; margin-top:10px;}
.energyfill{height:100%; background:var(--ok); transition:width .3s;}
.rolebadge{font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:8px; background:var(--panel2); color:var(--text2); white-space:nowrap;}
.rolebadge.owner{color:var(--star); background:rgba(255,207,74,.15);}
.rolebadge.admin{color:var(--accent); background:rgba(78,164,245,.15);}
.rolebadge.frozen{color:#7ec8ff; background:rgba(126,200,255,.12);}
.quoteblock{border-left:3px solid var(--accent); padding:3px 8px; margin-bottom:5px; background:rgba(255,255,255,.06); border-radius:6px; opacity:.9;}
.quoteblock .qname{font-size:11.5px; font-weight:700; color:var(--accent); display:block;}
.quoteblock .qtext{font-size:12.5px; color:var(--text2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px;}
.fwdlabel{font-size:11.5px; font-weight:700; color:var(--accent); margin-bottom:3px; display:flex; align-items:center; gap:4px;}
.msgimg{max-width:100%; border-radius:10px; display:block; margin-bottom:4px;}
.reactrow{display:flex; gap:4px; flex-wrap:wrap; margin-top:4px;}
.reactpill{display:flex; align-items:center; gap:3px; background:rgba(255,255,255,.1); border-radius:10px; padding:2px 7px; font-size:11.5px; cursor:pointer; color:var(--text);}
.reactpill.mine{background:var(--accent); color:#fff;}
.readtick{display:inline-flex; vertical-align:middle; margin-left:3px; color:var(--text2);}
.readtick.seen{color:var(--accent);}
.replybar{display:flex; align-items:center; gap:8px; padding:7px 12px; background:var(--panel2); border-top:1px solid var(--divider);}
.replybar .rb-line{width:3px; align-self:stretch; background:var(--accent); border-radius:2px;}
.replybar .rb-mid{flex:1 1 auto; min-width:0;}
.replybar .rb-name{font-size:12px; font-weight:700; color:var(--accent);}
.replybar .rb-text{font-size:12.5px; color:var(--text2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.replybar .rb-close{cursor:pointer; color:var(--text2); flex:0 0 auto;}
.pinnedbar{display:flex; align-items:center; gap:8px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--divider); cursor:pointer;}
.pinnedbar .pb-mid{flex:1 1 auto; min-width:0;}
.pinnedbar .pb-label{font-size:11px; color:var(--accent); font-weight:700;}
.pinnedbar .pb-text{font-size:12.5px; color:var(--text2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.attachbtn{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text2); cursor:pointer; flex:0 0 auto;}
.searchinput{flex:1; background:var(--panel2); border:none; border-radius:16px; padding:7px 12px; color:var(--text); font-size:14px; outline:none;}

textarea.textinput{resize:none;font-family:inherit;line-height:1.35;}
.ikb{clear:both;margin:8px -4px 0;display:flex;flex-direction:column;gap:4px;}
.ikrow{display:flex;gap:4px;}
.ikbtn{flex:1;text-align:center;padding:8px 6px;border-radius:8px;background:rgba(255,255,255,.1);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;}
.ikbtn:active{background:rgba(255,255,255,.22);}
.bubble.hasikb{min-width:230px;}
mark{background:#f5c542;color:#000;border-radius:3px;padding:0 1px;}
.banner{background:rgba(212,63,63,.14);color:var(--text);font-size:12.5px;padding:10px 14px;line-height:1.4;}
.banner .btn{display:inline-block;margin-top:6px;color:var(--accent);font-weight:700;cursor:pointer;}
.pinnedbar,.chatsearch{position:sticky;top:52px;z-index:19;}
.chatsearch{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--divider);color:var(--text2);}
.cscount{font-size:12px;color:var(--text2);min-width:38px;text-align:center;}
.reactrow{clear:both;}
.reactpick{display:flex;justify-content:space-around;padding:14px 10px 8px;color:var(--accent);}
.reactpick span{cursor:pointer;padding:6px 12px;border-radius:14px;display:flex;}
.reactpick span:active{background:var(--panel2);}
.voicebub{display:flex;align-items:center;gap:8px;min-width:170px;cursor:pointer;padding:2px 0;}
.vplay{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.vwave{display:flex;align-items:center;gap:2px;height:22px;flex:1;}
.vwave i{display:block;width:3px;border-radius:2px;background:var(--text2);opacity:.6;}
.vwave i.on{background:var(--accent);opacity:1;}
.vdur{font-size:11.5px;color:var(--text2);}
.pollq{font-weight:700;margin-bottom:6px;display:flex;gap:6px;align-items:flex-start;}
.pollopt{position:relative;display:flex;align-items:center;gap:8px;padding:6px 8px;margin:3px 0;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.06);cursor:pointer;min-width:210px;}
.pollopt>*{position:relative;}
.pollopt .pollbar{position:absolute;left:0;top:0;bottom:0;background:rgba(78,164,245,.3);transition:width .3s;}
.pollchk{width:16px;color:var(--accent);display:inline-flex;}
.pollt{flex:1;font-size:13.5px;}
.pollpct{font-size:12px;color:var(--text2);}
.pollmeta{font-size:11.5px;color:var(--text2);margin-top:4px;}
.giftbub{display:flex;align-items:center;gap:10px;padding:4px 2px;}
.giftbub .gic{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ff8a5c,#e0447a);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.msg-hl>.bubble{animation:hlflash 1.5s;}
@keyframes hlflash{0%,60%{box-shadow:0 0 0 3px var(--accent);}100%{box-shadow:none;}}
.inputbar.rec{align-items:center;}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:blinkdot 1s infinite;}
.rectime{flex:1;font-size:15px;}
@keyframes blinkdot{50%{opacity:.25;}}
.bubble{cursor:pointer;}
.bubble .readtick svg{vertical-align:-2px;}
</style>
</head>
<body>
<div id="phone">

const MOODS=['весёлый и любит шутить','немного саркастичный, но добрый','очень дружелюбный и открытый','спокойный и немногословный','энергичный и болтливый','застенчивый, но отзывчивый'];
const GROUP_TITLES=['Кино вечер','Мемы 24/7','Готовим вместе','Флудилка','Котики и всё такое','Movie Club','Учёба и всё такое','Качалка','Путешествия','Ночной чат','Книжный клуб','Игры онлайн'];

function makeBot(){
  const name=randOf(NAME_POOL);
  const id=uid('bot');
  return { id, name, username:translit(name)+Math.floor(100+Math.random()*899),
    age:16+Math.floor(Math.random()*22), trait:randOf(TRAITS), mood:randOf(MOODS),

    onlineNow:false, lastSeenAt:Date.now() };

/* ===================== ENTITY HELPERS ===================== */
function isBotId(id){ return !!id && id.indexOf('bot')===0; }
function getEntity(id){
  if(id==='me') return state.user;
  if(state.bots[id]) return state.bots[id];
  if(state.contacts[id]) return state.contacts[id];
  return null;
}
function displayName(id){
  const e = getEntity(id);
  if(!e) return '???';
  if(id==='me') return e.deleted ? 'Удалённый аккаунт' : (e.name||'Без имени');
  if(e.status==='deleted') return 'Удалённый аккаунт';
  return e.name;
}
function entityAvatarUrl(id){
  if(state.contactAvatarOverride[id]) return state.contactAvatarOverride[id];
  const e=getEntity(id);
  return e && e.avatar ? e.avatar : null;
}
function entityColor(id){
  const e=getEntity(id);
  if(e && e.color) return e.color;
  let h=0; for(const c of String(id||'x')) h=(h*31+c.charCodeAt(0))%360;
  return `hsl(${h},55%,50%)`;
}
function avatarHTML(id, size){
  size=size||50;
  const e=getEntity(id);
  const deleted = e && ((id==='me' && e.deleted) || e.status==='deleted');
  const url = deleted ? null : entityAvatarUrl(id);
  const badge = e && e.status==='frozen' ? `<span class="badgeicon">${icon('snowflake',12)}</span>` : '';
  if(url) return `<div class="avatar" style="width:${size}px;height:${size}px"><img src="${url}">${badge}</div>`;
  const initial = deleted ? icon('block',Math.round(size*0.5)) : (e&&e.isSystemBot ? icon('bot',Math.round(size*0.55)) : esc((displayName(id)||'?').trim().charAt(0).toUpperCase()));
  const bg = deleted ? '#5a636b' : entityColor(id);
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${bg};font-size:${Math.round(size*0.4)}px">${initial}${badge}</div>`;
}
function timeStr(ts){ const d=new Date(ts); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
function presenceLabel(bot){
  if(!bot) return '';
  if(bot.status==='deleted') return 'аккаунт удалён';
  if(bot.status==='frozen') return 'аккаунт заморожен';
  if(bot.isSystemBot||bot.isUserBot) return 'бот';
  if(bot.onlineNow) return 'в сети';
  const mins=Math.floor((Date.now()-(bot.lastSeenAt||bot.createdAt||Date.now()))/60000);
  if(mins<2) return 'был(а) только что';
  if(mins<60) return 'был(а) '+mins+' мин. назад';
  const hrs=Math.floor(mins/60);
  if(hrs<24) return 'был(а) '+hrs+' ч. назад';
  return 'был(а) недавно';
}

/* ===================== CHATS ===================== */
function getSystemChat(create){
  if(state.chats['sys']) return state.chats['sys'];
  if(!create) return null;
  const c={id:'sys', type:'system', title:'NebulaGram', messages:[], pinned:true, mutedUntil:0, unread:0};
  state.chats['sys']=c; return c;
}
function sysNotice(text, iconKey){
  const c=getSystemChat(true);
  c.messages.push({id:uid('m'), senderId:'sys', text, iconKey, time:Date.now(), system:true});
  if(state.currentChatId!=='sys') c.unread=(c.unread||0)+1;
}
function sysNoticeInChat(c, text, iconKey){ if(!c) return; c.messages.push({id:uid('m'), senderId:'sys', text, iconKey, time:Date.now(), system:true}); }
function newPrivateChat(otherId){
  const existing = Object.values(state.chats).find(c=>c.type==='private' && c.peerId===otherId);
  if(existing) return existing;
  const c={id:uid('chat'), type:'private', peerId:otherId, messages:[], mutedUntil:0, unread:0};
  state.chats[c.id]=c; return c;
}
function chatTitle(c){ if(c.type==='private') return displayName(c.peerId); return c.title; }
function chatLastMsg(c){ return c.messages[c.messages.length-1]; }
function sortedChats(){
  return Object.values(state.chats).sort((a,b)=>{
    if(!!a.pinned!==!!b.pinned) return a.pinned? -1:1;
    const ta=chatLastMsg(a)?chatLastMsg(a).time:0, tb=chatLastMsg(b)?chatLastMsg(b).time:0;
    return tb-ta;
  });
}
function entityColorForChat(c){ let h=0; for(const ch of String(c.id)) h=(h*31+ch.charCodeAt(0))%360; return `hsl(${h},50%,45%)`; }
function chatIconHtml(c,size){ return c.type==='channel' ? icon('megaphone',size) : icon('users',size); }

/* ===================== NAV ===================== */
function go(view){ state.stack.push(view); render(); }
function back(){ if(curView()==='chats.chat'){ state._chatSearchOpen=false; state._chatSearchQuery=''; if(recStart){ recStart=null; stopRecTimer(); } } if(state.stack.length>1) state.stack.pop(); closeSheet(); closeModal(); render(); }

function switchTab(tab){
  state.activeTab=tab;
  if(tab==='chats') state.stack=['chats.list'];
  else if(tab==='contacts') state.stack=['contacts.list'];
  else state.stack=['settings.root'];

/* ===================== UI: toast / sheet / modal ===================== */
function toast(msg){
  const s=document.getElementById('phone');
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  s.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}
function openSheet(title, items){
  closeSheet();
  const s=document.getElementById('phone');
  const bd=document.createElement('div'); bd.className='sheet-backdrop';
  bd.onclick=(e)=>{ if(e.target===bd) closeSheet(); };
  const sh=document.createElement('div'); sh.className='sheet';
  let html='';
  if(title) html+=`<div style="padding:10px 20px 4px;font-size:13px;color:var(--text2);font-weight:600">${esc(title)}</div>`;
  items.forEach((it,i)=>{ if(it.raw){ html+=it.html; return; } html+=`<div class="sitem ${it.danger?'danger':''}" onclick="__sheetAction(${i})">${it.icon?it.icon+' ':''}${esc(it.label)}</div>`; });
  html+=`<div class="scancel" onclick="closeSheet()">Отмена</div>`;
  sh.innerHTML=html;
  bd.appendChild(sh); s.appendChild(bd); sheetEl={bd, items};
}
window.__sheetAction=function(i){ const it=sheetEl.items[i]; closeSheet(); if(it.onClick) it.onClick(); };
function closeSheet(){ if(sheetEl){ sheetEl.bd.remove(); sheetEl=null; } }
function openModal(html){
  closeModal();
  const s=document.getElementById('phone');
  const bd=document.createElement('div'); bd.className='modal-backdrop';
  bd.onclick=(e)=>{ if(e.target===bd) closeModal(); };
  const box=document.createElement('div'); box.className='modalbox';
  box.innerHTML=html;
  bd.appendChild(box); s.appendChild(bd); modalEl=bd;
  return box;
}
function closeModal(){ if(modalEl){ modalEl.remove(); modalEl=null; } }

/* ===================== RENDER ===================== */
function render(){
  document.body.className = state.theme==='light' ? 'light':'';
  const clockEl=document.getElementById('clock');
  if(clockEl) clockEl.textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  const content=document.getElementById('content');
  const navslot=document.getElementById('navslot');
  const fabhost=document.getElementById('fabhost');
  let html='', showNav=false, fabHtml='';
  if(state.screen==='phone') html=renderPhoneScreen();
  else if(state.screen==='code') html=renderCodeScreen();
  else if(state.screen==='profilesetup') html=renderProfileSetupScreen();
  else if(state.screen==='deleted') html=renderDeletedScreen();
  else {
    showNav=true;
    const v=curView();
    if(v.indexOf('chats')===0) html=renderChatsArea(v);
    else if(v.indexOf('contacts')===0) html=renderContactsArea(v);
    else if(v.indexOf('settings')===0) html=renderSettingsArea(v);
    if(v==='chats.list') fabHtml=`<div class="fab" onclick="newChatSheet()">${icon('plus',26)}</div>`;
    else if(v==='contacts.list') fabHtml=`<div class="fab" onclick="openNewContactModal()">${icon('plus',26)}</div>`;
  }
  const ta0=document.getElementById('msginput'); const hadFocus=!!ta0 && document.activeElement===ta0;
  if(ta0 && ta0.dataset.chat){ state.drafts[ta0.dataset.chat]=ta0.value; }
  const viewKey=state.screen+'|'+(state.screen==='app'?curView()+'|'+(state.currentChatId||'')+'|'+(state.currentContactId||'')+'|'+(state.currentGroupChatId||''):'');
  const prevTop=content.scrollTop, atBottom=(content.scrollHeight-content.scrollTop-content.clientHeight)<90, sameView=(viewKey===lastViewKey);
  lastViewKey=viewKey;
  content.innerHTML=html;
  navslot.innerHTML = showNav?renderBottomNav():'';
  fabhost.innerHTML = fabHtml;
  if(state.screen==='code') focusHidden();
  const ta=document.getElementById('msginput');
  if(ta){ ta.value=state.drafts[state.currentChatId]||''; onMsgInput(ta); if(hadFocus) ta.focus(); }
  if(showNav && curView()==='chats.chat'){ if(!sameView || atBottom || state._forceBottom) content.scrollTop=content.scrollHeight; else content.scrollTop=prevTop; }
  else content.scrollTop = sameView ? prevTop : 0;
  state._forceBottom=false;
  scheduleSave();
}
function focusHidden(){ const h=document.getElementById('hidinput'); if(h) setTimeout(()=>h.focus(),40); }
setInterval(()=>{ const el=document.getElementById('clock'); if(el) el.textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }, 30000);

/* ===================== CHATS AREA ===================== */
function renderChatsArea(v){
  if(v==='chats.chat') return renderChatScreen();
  if(v==='chats.groupinfo') return renderGroupInfo();
  return renderChatsList();
}
function renderChatsList(){
  const q=(state._chatFilter||'').trim().toLowerCase();
  let folderHtml='';
  if(state.folders.length){
    folderHtml=`<div class="folderrow"><div class="folderpill ${state.activeFolder==='all'?'active':''}" onclick="state.activeFolder='all';render()">Все чаты</div>${state.folders.map(f=>`<div class="folderpill ${state.activeFolder===f.id?'active':''}" onclick="state.activeFolder='${f.id}';render()">${esc(f.name)}</div>`).join('')}</div>`;
  }
  return `<div class="topbar"><div class="title">Чаты</div></div>
    <div class="searchbar"><input placeholder="Поиск" value="${esc(state._chatFilter)}" oninput="filterChats(this.value)"></div>
    ${folderHtml}
    <div id="chatlistwrap">${chatListBody(q)}</div>`;
}
function filterChats(v){
  state._chatFilter=v;
  const wrap=document.getElementById('chatlistwrap');
  if(wrap) wrap.innerHTML=chatListBody(v.trim().toLowerCase());
}
function renderChatListItem(c,q){
  let title, av;
  if(c.type==='system'){ title='NebulaGram'; av=`<div class="avatar" style="width:50px;height:50px;background:#3d8fd9;font-size:22px">${icon('megaphone',20)}</div>`; }
  else if(c.type==='private'){ title=displayName(c.peerId); av=avatarHTML(c.peerId,50); }
  else { title=c.title; av=`<div class="avatar" style="width:50px;height:50px;background:${entityColorForChat(c)};font-size:20px">${chatIconHtml(c,22)}</div>`; }
  const last=chatLastMsg(c);
  let lastText;
  if(typingChats[c.id]) lastText='печатает...';
  else if(!last) lastText='Нет сообщений';
  else if(last.system) lastText=last.text;
  else lastText=(last.senderId==='me'?'Вы: ':(c.type!=='private'?displayName(last.senderId)+': ':''))+previewText(last);
  if(q && !chatTitle(c).toLowerCase().includes(q)){ const hit=[...c.messages].reverse().find(m=>!m.system && previewText(m).toLowerCase().includes(q)); if(hit) lastText=(hit.senderId==='me'?'Вы':displayName(hit.senderId))+': '+previewText(hit); }
  const deleted = c.type==='private' && state.bots[c.peerId] && state.bots[c.peerId].status==='deleted';
  return `<div class="listitem" onclick="openChat('${c.id}')" oncontextmenu="event.preventDefault();openChatMenu('${c.id}')">
    ${av}
    <div class="li-mid">
      <div class="li-top"><div class="li-name ${deleted?'deleted':''}">${esc(title)}</div><div class="li-time">${last?timeStr(last.time):''}</div></div>
      <div class="li-bottom"><div class="li-msg">${esc(lastText)}</div>${c.unread?`<div class="li-unread">${c.unread}</div>`:(c.mutedUntil>Date.now()?'<span class="li-muted">'+icon('bellslash',13)+'</span>':'')}</div>
    </div>
  </div>`;
}
function openChat(id){
  const c=state.chats[id]; if(!c) return;
  state.currentChatId=id; c.unread=0;
  go('chats.chat');
}
function openChatMenu(id){
  const c=state.chats[id]; if(!c) return;
  const items=[];
  if(c.type!=='system'){
    items.push({label:(c.pinned?'Открепить чат':'Закрепить чат'), icon:icon('pin',18), onClick:()=>{ c.pinned=!c.pinned; render(); }});
    items.push({label:(c.mutedUntil>Date.now()?'Включить уведомления':'Отключить уведомления'), icon:icon('bellslash',18), onClick:()=>{ c.mutedUntil = c.mutedUntil>Date.now()?0:Date.now()+3.15e10; render(); }});
  }
  if(c.type!=='system'){
    items.push({label:'Поиск по чату', icon:icon('search',18), onClick:()=>{ if(!(curView()==='chats.chat'&&state.currentChatId===id)){ state.currentChatId=id; c.unread=0; go('chats.chat'); } state._chatSearchOpen=false; toggleChatSearch(); }});
    items.push({label:'Очистить историю', icon:icon('trash',18), onClick:()=>{ c.messages=[]; c.pinnedId=null; toast('История очищена'); render(); }});
  }
  if(c.type==='group'||c.type==='channel'){
    items.push({label:'Информация о чате', icon:icon('info',18), onClick:()=>openGroupInfoFor(id)});
    items.push({label:c.type==='channel'?'Покинуть канал':'Покинуть группу', icon:icon('logout',18), danger:true, onClick:()=>userLeaveChat(id)});
  }
  if(c.type!=='system'){
    items.push({label:'Удалить чат', icon:icon('trash',18), danger:true, onClick:()=>{
      delete state.chats[id];
      if(state.currentChatId===id){ state.currentChatId=null; switchTab('chats'); } else render();
      toast('Чат удалён');
    }});
  }
  openSheet(chatTitle(c), items);
}
function userLeaveChat(id){
  delete state.chats[id];
  state.currentChatId=null;
  switchTab('chats');
  toast('Вы вышли из чата');
}
function newChatSheet(){
  const items=[
    {label:'Новая группа', icon:icon('users',20), onClick:()=>openNewGroupModal(false)},
    {label:'Новый канал', icon:icon('megaphone',20), onClick:()=>openNewGroupModal(true)},
    {label:'Новый контакт', icon:icon('user',20), onClick:()=>openNewContactModal()}
  ];
  if(Object.keys(state.contacts).length) items.unshift({label:'Написать контакту', icon:icon('edit',20), onClick:()=>openWriteContactSheet()});
  openSheet('Создать', items);
}
function openWriteContactSheet(){
  const items=Object.values(state.contacts).map(ct=>({label:ct.name, icon:icon('user',20), onClick:()=>{ const c=newPrivateChat(ct.id); state.currentChatId=c.id; go('chats.chat'); }}));
  openSheet('Выберите контакт', items);
}
function openNewContactModal(){
  openModal(`<div class="mtitle">Новый контакт</div>
    <div class="formlabel" style="margin-left:0">Имя</div>
    <input id="ncname" class="textinput" placeholder="Имя">
    <div class="formlabel" style="margin-left:0">Телефон</div>
    <input id="ncphone" class="textinput" placeholder="+7 900 000-00-00">
    <div class="formlabel" style="margin-left:0">Личность ИИ (необязательно)</div>
    <textarea id="ncprompt" class="textinput" rows="3" placeholder="Какой он: любит кофе, читает книги, шутит, говорит коротко..."></textarea>
    <div class="hint" style="margin:6px 0 0">Контакт будет отвечать как ИИ с этим характером. Пусто: характер случайный.</div>
    <div class="mrow"><button class="bigbtn ghost" onclick="closeModal()">Отмена</button><button class="bigbtn" onclick="createContact()">Создать</button></div>`);
}
function createContact(){
  const name=document.getElementById('ncname').value.trim();
  const phone=document.getElementById('ncphone').value.trim();
  if(!name){ toast('Введите имя'); return; }
  const id=uid('ct');
  state.contacts[id]={id, name, phone, username:'', bio:'', birthday:'', avatar:null, isBot:false, prompt:(document.getElementById('ncprompt').value||'').trim().slice(0,2000)};
  closeModal(); toast('Контакт добавлен');
  switchTab('contacts');
}
function openNewGroupModal(isChannel){
  const allMembers=[...Object.values(state.contacts), ...pickableBots()];
  openModal(`<div class="mtitle">${isChannel?'Новый канал':'Новая группа'}</div>
    <div class="formlabel" style="margin-left:0">Название</div>
    <input id="ngname" class="textinput" placeholder="${isChannel?'Название канала':'Название группы'}">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px">
      <span style="font-size:14px">Публичный (по ссылке)</span>
      <div class="switch" id="ngpublic" onclick="this.classList.toggle('on')"><div class="knob"></div></div>
    </div>
    ${allMembers.length?`<div class="formlabel" style="margin-left:0">Участники</div><div>${allMembers.map(m=>`<label class="pickitem"><input type="checkbox" value="${m.id}" class="ngmember">${esc(m.name)}</label>`).join('')}</div>`:'<div class="hint">Пока нет контактов или ботов для добавления</div>'}
    <div class="mrow"><button class="bigbtn ghost" onclick="closeModal()">Отмена</button><button class="bigbtn" onclick="createGroupOrChannel(${isChannel?'true':'false'})">Создать</button></div>`);
}
function createGroupOrChannel(isChannel){
  const name=document.getElementById('ngname').value.trim();
  if(!name){ toast('Введите название'); return; }
  const isPublic=document.getElementById('ngpublic').classList.contains('on');
  const members=Array.from(document.querySelectorAll('.ngmember:checked')).map(el=>el.value);
  const id=uid('chat');
  const chat={ id, type:isChannel?'channel':'group', title:name,
    members:['me', ...members], admins:['me'], creatorId:'me', isPublic,
    link: isPublic ? 'nebulagram.me/'+translit(name).replace(/[^a-z0-9]/g,'').slice(0,14)+Math.floor(Math.random()*90) : null,
    messages:[], mutedUntil:0, unread:0 };
  state.chats[id]=chat;
  sysNoticeInChat(chat, (isChannel?'Канал':'Группа')+' «'+name+'» создан'+(isChannel?'':'а')+(isPublic?' • публичная ссылка активна':''));
  closeModal(); toast((isChannel?'Канал':'Группа')+' создан'+(isChannel?'':'а'));
  state.currentChatId=id; state.activeTab='chats'; state.stack=['chats.list','chats.chat']; render();
}
/* ===================== CHAT SCREEN ===================== */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let recStart=null, recTimer=null, aiFailAt=0, lastViewKey='';
const REACTIONS=['like','heart','laugh','fire'];
const botBusy={}, playing={};
function findMsg(c,id){ return c.messages.find(m=>m.id===id); }
function curChat(){ return state.chats[state.currentChatId]; }
function isChatOpen(id){ return state.screen==='app' && curView()==='chats.chat' && state.currentChatId===id; }
function fmtDur(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function plural(n){ const a=n%10,b=n%100; return (a===1&&b!==11)?'голос':((a>=2&&a<=4&&(b<10||b>=20))?'голоса':'голосов'); }
function previewText(m){
  if(m.system) return m.text;
  if(m.poll) return 'Опрос: '+m.poll.q;
  if(m.voice) return 'Голосовое сообщение';
  if(m.gift) return 'Подарок';
  if(m.image && !m.text) return 'Фото';
  return (m.image?'Фото, ':'')+(m.text||'');
}
function hl(text){
  const q=state._chatSearchOpen ? (state._chatSearchQuery||'').trim() : '';
  if(!q) return esc(text);
  const lo=text.toLowerCase(), ql=q.toLowerCase();
  let out='', i=0;
  while(true){ const j=lo.indexOf(ql,i); if(j<0){ out+=esc(text.slice(i)); break; } out+=esc(text.slice(i,j))+'<mark>'+esc(text.slice(j,j+q.length))+'</mark>'; i=j+q.length; }
  return out;
}
function peerEntity(c){ return state.bots[c.peerId]||state.contacts[c.peerId]||null; }
function peerReplyable(p){ return !!p && (p.status===undefined || p.status==='active'); }
function disabledReason(c){
  if(state.user.frozen) return 'Отправка недоступна';
  if(c.type==='system') return 'Официальные уведомления';
  if(c.type==='private'){
    const p=state.bots[c.peerId];
    if(p&&(p.status==='frozen'||p.status==='deleted')) return 'Отправка недоступна';
    if(state.blocked[c.peerId]) return 'Пользователь заблокирован';
  }
  if(c.type==='channel' && !(c.admins||[]).includes('me')) return 'Писать в канал могут только админы';
  return '';
}
function chatDisabled(c){ return !!disabledReason(c); }
function onlineCount(c){ return (c.members||[]).filter(id=>id==='me' || (state.bots[id]&&state.bots[id].status==='active'&&state.bots[id].onlineNow)).length; }
function renderVoice(m){
  const wave=(m.voice.wave||[]).map(h=>'<i style="height:'+h+'px"></i>').join('');
  return '<div class="voicebub" onclick="event.stopPropagation();playVoice(\''+m.id+'\')"><div class="vplay" id="vp_'+m.id+'">'+icon('play',16)+'</div><div class="vwave" id="vw_'+m.id+'">'+wave+'</div><span class="vdur">'+fmtDur(m.voice.dur)+'</span></div>';
}
function renderPoll(m){
  const total=m.poll.opts.reduce((s,o)=>s+o.v.length,0);
  const rows=m.poll.opts.map((o,i)=>{
    const mine=o.v.includes('me'); const pct=total?Math.round(o.v.length/total*100):0;
    return '<div class="pollopt '+(mine?'mine':'')+'" onclick="event.stopPropagation();votePoll(\''+m.id+'\','+i+')"><div class="pollbar" style="width:'+pct+'%"></div><span class="pollchk">'+(mine?icon('check',14):'')+'</span><span class="pollt">'+esc(o.t)+'</span><span class="pollpct">'+(total?pct+'%':'')+'</span></div>';
  }).join('');
  return '<div class="pollq">'+icon('poll',15,'margin-top:2px')+'<span>'+esc(m.poll.q)+'</span></div>'+rows+'<div class="pollmeta">'+total+' '+plural(total)+'</div>';
}
function renderMessage(m,c){
  if(m.system) return '<div class="systemmsg" id="m_'+m.id+'">'+(m.iconKey?icon(m.iconKey,14,'margin-right:5px;'):'')+esc(m.text)+'</div>';
  const out=m.senderId==='me';
  const showName=c.type!=='private' && !out;
  let b='';
  if(showName) b+='<span class="sname">'+esc(displayName(m.senderId))+'</span>';
  if(m.fwdFrom) b+='<div class="fwdlabel">'+icon('forward',13)+' Переслано от '+esc(m.fwdFrom)+'</div>';
  if(m.replyToId){
    const r=findMsg(c,m.replyToId);
    b+= r ? '<div class="quoteblock" onclick="event.stopPropagation();jumpToMsg(\''+r.id+'\')"><span class="qname">'+esc(displayName(r.senderId))+'</span><div class="qtext">'+esc(previewText(r))+'</div></div>'
          : '<div class="quoteblock"><div class="qtext">Сообщение удалено</div></div>';
  }
  if(m.image) b+='<img class="msgimg" src="'+m.image+'" onclick="event.stopPropagation();viewImage(\''+m.id+'\')">';
  if(m.voice) b+=renderVoice(m);
  if(m.poll) b+=renderPoll(m);
  if(m.gift) b+='<div class="giftbub"><div class="gic">'+icon(m.gift.icon,24)+'</div><div>Подарок для вас!</div></div>';
  else if(m.text) b+=hl(m.text);
  const tick = out ? '<span class="readtick '+(m.read?'seen':'')+'">'+icon(m.read?'checkdouble':'check',13)+'</span>' : '';
  b+='<span class="btime">'+(m.edited?'изменено ':'')+timeStr(m.time)+tick+'</span>';
  const rx=m.reactions||{}; const keys=Object.keys(rx).filter(k=>rx[k].length);
  if(keys.length) b+='<div class="reactrow">'+keys.map(k=>'<span class="reactpill '+(rx[k].includes('me')?'mine':'')+'" onclick="event.stopPropagation();reactMsg(\''+m.id+'\',\''+k+'\')">'+icon(k,13)+' '+rx[k].length+'</span>').join('')+'</div>';
  if(m.buttons) b+='<div class="ikb">'+m.buttons.map((row,ri)=>'<div class="ikrow">'+row.map((bt,bi)=>'<span class="ikbtn" onclick="event.stopPropagation();pressBtn(\''+m.id+'\','+ri+','+bi+')">'+esc(bt.t)+'</span>').join('')+'</div>').join('')+'</div>';
  return '<div class="msgrow '+(out?'out':'')+'" id="m_'+m.id+'"><div class="bubble '+(out?'out':'in')+(m.buttons?' hasikb':'')+'" onclick="msgTap(\''+m.id+'\')">'+b+'</div></div>';
}
function messagesHtml(c){
  let h=c.messages.map(m=>renderMessage(m,c)).join('');
  if(typingChats[c.id]) h+='<div class="typingind">'+esc(displayName(typingChats[c.id]))+' печатает...</div>';
  return h || '<div class="hint" style="text-align:center">Нет сообщений. Напишите первым!</div>';
}
function renderChatScreen(){
  const c=state.chats[state.currentChatId];
  if(!c){ return renderChatsList(); }
  if(state._chatSearchOpen && state._searchChat!==c.id){ state._chatSearchOpen=false; state._chatSearchQuery=''; }
  let title, sub, avHtml, headerAttr='';
  if(c.type==='system'){ title='NebulaGram'; sub='официальные уведомления'; avHtml='<div class="avatar" style="width:38px;height:38px;background:#3d8fd9;font-size:16px">'+icon('megaphone',18)+'</div>'; }
  else if(c.type==='private'){
    const bot=state.bots[c.peerId];
    title=displayName(c.peerId);
    if(typingChats[c.id]) sub='печатает...';
    else if(bot) sub=presenceLabel(bot);
    else sub=state.settings.privacy.lastSeen==='nobody'?'':'был(а) недавно';
    avHtml=avatarHTML(c.peerId,38);
    headerAttr='onclick="openContactOrBot(\''+c.peerId+'\')"';
  } else {
    title=c.title;
    sub = typingChats[c.id] ? displayName(typingChats[c.id])+' печатает...' : (c.members?c.members.length:0)+' участник(ов), '+onlineCount(c)+' в сети';
    avHtml='<div class="avatar" style="width:38px;height:38px;background:'+entityColorForChat(c)+';font-size:16px">'+chatIconHtml(c,18)+'</div>';
    headerAttr='onclick="openGroupInfoFor(\''+c.id+'\')"';
  }
  const pm = c.pinnedId ? findMsg(c,c.pinnedId) : null;
  const pinnedHtml = pm ? '<div class="pinnedbar" onclick="jumpToMsg(\''+pm.id+'\')">'+icon('pushpin',18,'color:var(--accent)')+'<div class="pb-mid"><div class="pb-label">Закреплённое сообщение</div><div class="pb-text">'+esc(previewText(pm))+'</div></div><span class="iconbtn" style="color:var(--text2)" onclick="event.stopPropagation();togglePin(\''+pm.id+'\')">'+icon('close',16)+'</span></div>' : '';
  const searchHtml = state._chatSearchOpen ? '<div class="chatsearch"><input class="searchinput" id="csinput" placeholder="Поиск по чату" value="'+esc(state._chatSearchQuery)+'" oninput="chatSearch(this.value)"><span id="cscount" class="cscount">'+searchCountLabel(c)+'</span><span class="iconbtn" onclick="chatSearchStep(-1)">'+icon('chevleft',20,'transform:rotate(90deg)')+'</span><span class="iconbtn" onclick="chatSearchStep(1)">'+icon('chevleft',20,'transform:rotate(-90deg)')+'</span><span class="iconbtn" onclick="toggleChatSearch()">'+icon('close',20)+'</span></div>' : '';
  const reason=disabledReason(c);
  const rp = state.replyTo && state.replyTo.chatId===c.id ? findMsg(c,state.replyTo.msgId) : null;
  const replyHtml = rp ? '<div class="replybar"><div class="rb-line"></div><div class="rb-mid"><div class="rb-name">'+esc(displayName(rp.senderId))+'</div><div class="rb-text">'+esc(previewText(rp))+'</div></div><span class="rb-close" onclick="cancelReply()">'+icon('close',18)+'</span></div>' : '';
  let bar;
  if(recStart){
    bar='<div class="inputbar rec"><span class="iconbtn" style="color:var(--danger)" onclick="cancelRecord()">'+icon('trash',22)+'</span><div class="recdot"></div><div id="rectime" class="rectime">'+fmtDur((Date.now()-recStart)/1000)+'</div><div class="sendbtn" onclick="finishRecord()">'+icon('send',17)+'</div></div>';
  } else if(c.type==='channel' && reason==='Писать в канал могут только админы'){
    bar='<div class="inputbar" style="justify-content:center;color:var(--text2);font-size:13px;padding:14px">'+esc(reason)+'</div>';
  } else {
    bar='<div class="inputbar"><span class="iconbtn attachbtn" style="color:var(--text2);padding:9px 2px" onclick="attachSheet()">'+icon('attach',22)+'</span><textarea id="msginput" data-chat="'+c.id+'" rows="1" placeholder="'+esc(reason||'Сообщение')+'" '+(reason?'disabled':'')+' oninput="onMsgInput(this)" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea><div class="sendbtn" id="sendbtn" style="display:none" onclick="sendMessage()">'+icon('send',17)+'</div><div class="sendbtn" id="micbtn" onclick="startRecord()">'+icon('mic',18)+'</div></div>';
  }
  return '<div class="topbar"><span class="back" onclick="back()">‹</span><div class="titlewrap" style="flex-direction:row;align-items:center;gap:8px;cursor:pointer" '+headerAttr+'>'+avHtml+'<div style="display:flex;flex-direction:column;min-width:0"><div class="title">'+esc(title)+'</div><div class="sub">'+esc(sub)+'</div></div></div><div class="actions"><span class="iconbtn" onclick="toggleChatSearch()">'+icon('search',22)+'</span><span class="iconbtn" onclick="openChatMenu(\''+c.id+'\')">'+icon('dotsv',22)+'</span></div></div>'
    + searchHtml + pinnedHtml
    + (state.user.frozen?'<div class="banner">'+icon('snowflake',16)+' Ваш аккаунт заморожен за подозрение в спам-активности. Отправка сообщений недоступна.<div class="btn" onclick="appealFreeze()">Подать апелляцию</div></div>':'')
    + '<div class="messages">'+messagesHtml(c)+'</div>'
    + replyHtml + bar;
}
function onMsgInput(el){
  const has=el.value.trim().length>0;
  const sb=document.getElementById('sendbtn'), mb=document.getElementById('micbtn');
  if(sb) sb.style.display=has?'flex':'none';
  if(mb) mb.style.display=has?'none':'flex';
  el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,100)+'px';
}
function jumpToMsg(id){
  const el=document.getElementById('m_'+id); if(!el) return;
  el.scrollIntoView({block:'center',behavior:'smooth'});
  el.classList.add('msg-hl'); setTimeout(()=>el.classList.remove('msg-hl'),1500);
}
/* ---- in-chat search ---- */
function searchMatches(c){ const q=(state._chatSearchQuery||'').trim().toLowerCase(); if(!q) return []; return c.messages.filter(m=>!m.system && previewText(m).toLowerCase().includes(q)).map(m=>m.id); }
function searchCountLabel(c){ if(!(state._chatSearchQuery||'').trim()) return ''; const ms=searchMatches(c); return ms.length ? (((state._searchIdx||0)%ms.length)+1)+'/'+ms.length : '0'; }
function toggleChatSearch(){
  state._chatSearchOpen=!state._chatSearchOpen; state._chatSearchQuery=''; state._searchIdx=0; state._searchChat=state.currentChatId;
  render(); if(state._chatSearchOpen) setTimeout(()=>{ const i=document.getElementById('csinput'); if(i) i.focus(); },60);
}
function chatSearch(v){
  const c=curChat(); if(!c) return;
  state._chatSearchQuery=v;
  const ms=searchMatches(c); state._searchIdx=Math.max(0,ms.length-1);
  const box=document.querySelector('.messages'); if(box) box.innerHTML=messagesHtml(c);
  const cnt=document.getElementById('cscount'); if(cnt) cnt.textContent=searchCountLabel(c);
  if(ms.length) jumpToMsg(ms[state._searchIdx]);
}
function chatSearchStep(d){
  const c=curChat(); if(!c) return; const ms=searchMatches(c); if(!ms.length) return;
  state._searchIdx=(((state._searchIdx||0)+d)%ms.length+ms.length)%ms.length;
  const cnt=document.getElementById('cscount'); if(cnt) cnt.textContent=searchCountLabel(c);
  jumpToMsg(ms[state._searchIdx]);
}
/* ---- message actions ---- */
function msgTap(id){
  const c=curChat(); if(!c) return;
  const m=findMsg(c,id); if(!m||m.system) return;
  const out=m.senderId==='me';
  const items=[{raw:true, html:'<div class="reactpick">'+REACTIONS.map(k=>'<span onclick="closeSheet();reactMsg(\''+id+'\',\''+k+'\')">'+icon(k,26)+'</span>').join('')+'</div>'}];
  if(!chatDisabled(c)) items.push({label:'Ответить', icon:icon('reply',18), onClick:()=>startReply(id)});
  if(m.text) items.push({label:'Копировать', icon:icon('copy',18), onClick:()=>copyText(m.text)});
  items.push({label:'Переслать', icon:icon('forward',18), onClick:()=>forwardSheet(id)});
  items.push({label:c.pinnedId===id?'Открепить':'Закрепить', icon:icon('pushpin',18), onClick:()=>togglePin(id)});
  if(out && m.text && !m.poll && !m.voice && !m.gift) items.push({label:'Изменить', icon:icon('edit',18), onClick:()=>editMsg(id)});
  items.push({label:'Удалить', icon:icon('trash',18), danger:true, onClick:()=>deleteMsg(id)});
  openSheet(null, items);
}
function applyReaction(m,key,who){
  m.reactions=m.reactions||{};
  const had=(m.reactions[key]||[]).includes(who);
  Object.keys(m.reactions).forEach(k=>{ m.reactions[k]=m.reactions[k].filter(x=>x!==who); });
  if(!had) m.reactions[key]=(m.reactions[key]||[]).concat(who);
  Object.keys(m.reactions).forEach(k=>{ if(!m.reactions[k].length) delete m.reactions[k]; });
}
function reactMsg(id,key){ const c=curChat(); if(!c) return; const m=findMsg(c,id); if(!m) return; applyReaction(m,key,'me'); render(); }
function botReact(chat,bot){
  const mine=[...chat.messages].reverse().find(m=>m.senderId==='me' && !m.system);
  if(mine){ applyReaction(mine, randOf(REACTIONS), bot.id); }
}
function startReply(id){ state.replyTo={chatId:state.currentChatId,msgId:id}; render(); setTimeout(()=>{ const t=document.getElementById('msginput'); if(t) t.focus(); },60); }
function cancelReply(){ state.replyTo=null; render(); }
function replyId(){ return (state.replyTo && state.replyTo.chatId===state.currentChatId) ? state.replyTo.msgId : undefined; }
function copyText(t){ try{ navigator.clipboard.writeText(t).then(()=>toast('Скопировано'),()=>toast('Не удалось скопировать')); }catch(e){ toast('Не удалось скопировать'); } }
function togglePin(id){ const c=curChat(); if(!c) return; c.pinnedId = c.pinnedId===id ? null : id; toast(c.pinnedId?'Сообщение закреплено':'Сообщение откреплено'); render(); }
function deleteMsg(id){
  const c=curChat(); if(!c) return;
  c.messages=c.messages.filter(m=>m.id!==id);
  if(c.pinnedId===id) c.pinnedId=null;
  if(state.replyTo && state.replyTo.msgId===id) state.replyTo=null;
  toast('Сообщение удалено'); render();
}
function editMsg(id){
  const c=curChat(); const m=c&&findMsg(c,id); if(!m) return;
  openModal('<div class="mtitle">Изменить сообщение</div><textarea id="editta" class="textinput" rows="4">'+esc(m.text)+'</textarea><div class="mrow"><button class="bigbtn ghost" onclick="closeModal()">Отмена</button><button class="bigbtn" onclick="saveEdit(\''+id+'\')">Сохранить</button></div>');
}
function saveEdit(id){
  const c=curChat(); const m=c&&findMsg(c,id); if(!m) return;
  const v=document.getElementById('editta').value.trim(); if(!v){ toast('Сообщение не может быть пустым'); return; }
  if(v!==m.text){ m.text=v; m.edited=true; }
  closeModal(); render();
}
function forwardSheet(id){
  const src=curChat(); const m=src&&findMsg(src,id); if(!m) return;
  if(m.poll){ toast('Опрос нельзя переслать'); return; }
  const items=[];
  Object.values(state.chats).filter(c=>c.type!=='system' && c.id!==src.id && !chatDisabled(c)).forEach(c=>{
    items.push({label:chatTitle(c), icon:icon(c.type==='private'?'user':(c.type==='channel'?'megaphone':'users'),18), onClick:()=>doForward(m,c)});
  });
  Object.values(state.contacts).filter(ct=>!Object.values(state.chats).some(c=>c.type==='private'&&c.peerId===ct.id) && !state.blocked[ct.id]).forEach(ct=>{
    items.push({label:ct.name, icon:icon('user',18), onClick:()=>doForward(m,newPrivateChat(ct.id))});
  });
  if(!items.length){ toast('Некому пересылать'); return; }
  openSheet('Переслать в...', items);
}
function doForward(m,target){

async function callClaudeApi(system, messages, maxTokens){
  const headers={'Content-Type':'application/json'};
  if(state.apiKey){ headers['x-api-key']=state.apiKey; headers['anthropic-version']='2023-06-01'; headers['anthropic-dangerous-direct-browser-access']='true'; }
  let resp;
  try{
    resp=await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers,
      body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:maxTokens||220, system, messages})
    });
  }catch(e){ state.aiError='Сеть/доступ заблокирован'; throw e; }
  if(!resp.ok){
    let d=''; try{ const j=await resp.json(); d=(j.error&&j.error.message)||''; }catch(e){}
    state.aiError='HTTP '+resp.status+(d?': '+d:'');
    throw new Error(state.aiError);
  }
  const data=await resp.json();
  if(data.error) throw new Error(data.error.message||'api error');
  const t=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(' ').trim();
  if(!t) throw new Error('empty response');
  return t;
}
function msgToText(m){
  if(m.system) return null;
  if(m.poll) return '[опрос: '+m.poll.q+' — варианты: '+m.poll.opts.map(o=>o.t).join(', ')+']';
  if(m.voice) return '[голосовое сообщение, '+m.voice.dur+' сек; ты не можешь его прослушать прямо сейчас]';
  if(m.gift) return '[подарок]';
  let t=m.text||'';
  if(m.image) t='[фото] '+t;
  if(m.fwdFrom) t='(пересланное от '+m.fwdFrom+') '+t;
  return t.trim();
}
function personaSystemPrompt(bot, chat, opts){

  const u=state.user;

  const uname=bot.username||translit(bot.name||'user');
  let ctx='';
  if(chat && chat.type==='private') ctx='Ты переписываешься лично с пользователем по имени '+(u.name||'без имени')+(u.bio?' (в профиле у него написано: «'+u.bio+'»)':'')+'.';
  else if(chat) ctx='Ты в '+(chat.type==='channel'?'канале':'групповом чате')+' «'+chat.title+'». Участники: '+(chat.members||[]).map(displayName).filter(n=>n!==bot.name).join(', ')+'. Можно обращаться к людям по имени.';
  if(bot.isUserBot){

  }
  const extra=[];
  if(opts.opener) extra.push('Ты сам(а) первым пишешь этому человеку в личку: познакомься или найди естественный повод (общий чат, интересы). Одно короткое сообщение, без банального «привет, как дела».');
  if(opts.channelPost) extra.push('Ты автор канала: пиши пост от первого лица — мысль, новость из твоей жизни или мнение по твоей теме, 1–3 коротких предложения.');
  return 'Ты — '+bot.name+' (@'+uname+')'+(bot.prompt?', ты живой человек в мессенджере. Пользователь задал тебе личность, строго придерживайся её: «'+bot.prompt+'». ':', тебе '+age+' лет, ты живой человек в мессенджере. Твои интересы и черты: '+trait+'. Твой характер: '+mood+'. ')+'Сейчас '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'. '+ctx+' '+lang+'\n'
   +'Правила: пиши как настоящий человек в чате — коротко (обычно одно предложение, максимум два), неформально, иногда без заглавной буквы и точки. Отвечай именно по смыслу последних сообщений, помни всё сказанное раньше, задавай встречные вопросы, когда уместно, имей своё мнение и вкусы, можешь спорить и шутить. Не используй эмодзи, списки, markdown и кавычки, не начинай с собственного имени, не повторяй уже сказанные фразы и не здоровайся заново. Не упоминай без необходимости, что ты программа, оставайся в роли. Если пришло фото — отреагируй на то, что реально на нём видно. Если пришло голосовое — скажи, что не можешь послушать сейчас, и попроси написать текстом. '+extra.join(' ');
}
function buildAiMessages(bot, chat, opts){
  opts=opts||{};
  const hist=chat.messages.filter(m=>!m.system).slice(-24);
  if(chat.type==='private'){
    const out=[];
    hist.forEach(m=>{
      const role=m.senderId===bot.id?'assistant':'user';
      const txt=msgToText(m); if(txt==null) return;
      const last=out[out.length-1];
      if(last && last.role===role) last.content+='\n'+txt; else out.push({role, content:txt});
    });
    if(!out.length || out[0].role!=='user') out.unshift({role:'user', content:'(вы только что начали переписку)'});
    if(out[out.length-1].role!=='user') out.push({role:'user', content:'(продолжи разговор сам(а))'});
    const lastImg=[...hist].reverse().slice(0,3).find(m=>m.image && m.senderId!==bot.id);
    if(lastImg){
      const mm=/^data:(image\/[a-z+]+);base64,(.+)$/.exec(lastImg.image);
      const lm=out[out.length-1];
      if(mm && lm.role==='user' && typeof lm.content==='string' && lm.content.indexOf('[фото]')>=0){
        lm.content=[{type:'image', source:{type:'base64', media_type:mm[1], data:mm[2]}}, {type:'text', text:lm.content}];
      }
    }
    return out;
  }
  const transcript=hist.map(m=>displayName(m.senderId)+(m.senderId===bot.id?' (это ты)':'')+': '+msgToText(m)).join('\n');
  const instr = opts.channelPost
    ? 'Напиши новый пост для своего канала «'+chat.title+'». Только текст поста.'
    : 'Последние сообщения в чате:\n'+(transcript||'(пока пусто — начни разговор на свою тему)')+'\n\n'+(bot.isUserBot?'Ответь на последнее сообщение, адресованное тебе (от лица '+bot.name+'). Только текст ответа.':'Напиши свою следующую реплику в чате от лица '+bot.name+'. Только текст сообщения.');
  return [{role:'user', content:instr}];
}
function cleanReply(t,bot){
  t=String(t||'').trim();
  if(bot.isUserBot) return t.slice(0,1200);
  const nm=String(bot.name||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  if(nm) t=t.replace(new RegExp('^'+nm+'\\s*[:\\-—]\\s*','i'),'');
  t=t.replace(/^["«“]+|["»”]+$/g,'');
  t=t.replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu,'').replace(/[ \t]{2,}/g,' ').trim();
  if(t.length>420) t=t.slice(0,420);
  return t;
}
async function generateBotMessage(bot, chat, opts){
  opts=opts||{};
  const sys=personaSystemPrompt(bot,chat,opts);
  const messages=buildAiMessages(bot,chat,opts);
  for(let attempt=0; attempt<2; attempt++){
    try{
      const raw=await callAI(sys,messages,bot.isUserBot?500:220);
      const clean=cleanReply(raw,bot);
      if(clean){ state.aiStatus='ok'; state.aiError=''; return clean; }
    }catch(e){ console.error('ai error', e); if(attempt===0) await sleep(900); }
  }
  state.aiStatus='fail';
  return null;
}
function aiFail(){ const now=Date.now(); if(now-aiFailAt>25000){ aiFailAt=now; toast('ИИ недоступен: '+(state.aiError||'нет соединения')+'. Настройки → ИИ ботов'); } }
function markPresence(bot,on){ if(!bot) return; bot.onlineNow=!!on; bot.lastSeenAt=Date.now(); }
function markRead(chat){ chat.messages.forEach(m=>{ if(m.senderId==='me') m.read=true; }); }
async function triggerBotReply(chat, bot){
  if(state.user.deleted || state.blocked[bot.id]) return;
  const key=chat.id+'|'+bot.id;
  if(botBusy[key]){ botBusy[key]='again'; return; }
  botBusy[key]=true;
  try{
    await sleep(700+Math.random()*1300);
    if(!state.chats[chat.id] || (bot.status && bot.status!=='active') || state.blocked[bot.id]) return;
    markPresence(bot,true); markRead(chat);
    if(!bot.isUserBot && Math.random()<0.18) botReact(chat,bot);
    typingChats[chat.id]=bot.id; render();
    const t0=Date.now();
    const text=await generateBotMessage(bot,chat);
    if(text){ const need=Math.min(2600,text.length*40)-(Date.now()-t0); if(need>0) await sleep(need); }
    delete typingChats[chat.id];
    if(!state.chats[chat.id]) return;
    if(!text){ aiFail(); render(); return; }
    chat.messages.push({id:uid('m'), senderId:bot.id, text, time:Date.now()});
    if(!isChatOpen(chat.id)) chat.unread=(chat.unread||0)+1;
    playNotifSound(); render();
  } finally {
    delete typingChats[chat.id];
    const again=botBusy[key]==='again'; delete botBusy[key];
    if(again) triggerBotReply(chat,bot);
  }
}
function maybeGroupBotReply(chat,m){
  const raw=(m&&m.text)||''; const txt=raw.toLowerCase();
  const mem=(chat.members||[]).map(id=>state.bots[id]).filter(b=>b&&b.status==='active'&&!state.blocked[b.id]&&!b.isSystemBot);
  const ubs=mem.filter(b=>b.isUserBot);
  const repliedSender=(m&&m.replyToId)?((findMsg(chat,m.replyToId)||{}).senderId):null;
  let handled=false;
  ubs.forEach((ub,i)=>{
    const cmd=parseCmd(raw,ub);
    const known=cmd&&(cmd.name==='start'||cmd.name==='help'||(ub.commands||{})[cmd.name]);
    const addressed=txt.includes('@'+String(ub.username).toLowerCase())||repliedSender===ub.id||(known&&(ubs.length===1||raw.indexOf('@')>=0));
    if(addressed){ handled=true; setTimeout(()=>userBotRespond(chat,ub,m),i*800); }
  });
  if(handled) return;
  const members=mem.filter(b=>isNpcBot(b)).map(b=>b.id);
  if(!members.length) return;
  let chosen=members.filter(id=>{ const b=state.bots[id]; return txt.includes('@'+b.username.toLowerCase()) || txt.includes(b.name.toLowerCase()); }).slice(0,2);
  if(!chosen.length && repliedSender && members.includes(repliedSender)) chosen=[repliedSender];
  if(!chosen.length){
    if(Math.random()>0.8) return;
    chosen=[randOf(members)];
    if(members.length>1 && Math.random()<0.25) chosen.push(randOf(members.filter(x=>x!==chosen[0])));
  }
  chosen.forEach((id,i)=>setTimeout(()=>triggerBotReply(chat,state.bots[id]), i*3000));
}

  r.readAsDataURL(f);
}

  const b=state.bots[id];
  state.contacts[id]={id, name:b.name, username:b.username, phone:'', bio:b.trait, birthday:'', avatar:b.avatar, isBot:true};
  toast('Добавлено в контакты'); render();

function contactMoreSheet(id){
  const c=state.contacts[id];
  const pc=Object.values(state.chats).find(x=>x.type==='private'&&x.peerId===id);
  const items=[];
  if(pc) items.push({label:pc.mutedUntil>Date.now()?'Включить уведомления':'Отключить уведомления', icon:icon('bellslash',18), onClick:()=>{ pc.mutedUntil=pc.mutedUntil>Date.now()?0:Date.now()+3.15e10; toast(pc.mutedUntil?'Уведомления отключены':'Уведомления включены'); render(); }});
  if(c) items.push({label:'Удалить контакт', icon:icon('trash',18), danger:true, onClick:()=>{ delete state.contacts[id]; toast('Контакт удалён'); switchTab('contacts'); }});
  const isBl=!!state.blocked[id];
  items.push({label:isBl?'Разблокировать':'Заблокировать', icon:icon('block',18), danger:!isBl, onClick:()=>{ if(isBl) delete state.blocked[id]; else state.blocked[id]=true; toast(isBl?'Пользователь разблокирован':'Пользователь заблокирован'); render(); }});
  openSheet(displayName(id), items);
}

/* ===================== BOT ENGINE ===================== */
function activeBots(){ return Object.values(state.bots).filter(b=>b.status==='active'&&isNpcBot(b)); }
function hiddenBots(){ return Object.values(state.bots).filter(b=>b.status==='hidden'&&isNpcBot(b)); }
function publicChats(){ return Object.values(state.chats).filter(c=>(c.type==='group'||c.type==='channel')&&c.isPublic); }
function bootEngine(){
  if(engineLoopStarted) return;
  engineLoopStarted=true;
  for(let i=Object.values(state.bots).filter(isNpcBot).length;i<5;i++) actSpawnBot();
  if(Object.values(state.chats).filter(c=>c.type!=='system').length===0){
    setTimeout(()=>{ if(state.user.deleted) return; const r=actBotDMUser(); if(r&&r.catch) r.catch(console.error); }, 9000);
  }
  scheduleEngine();
  setInterval(energyRegen, 3000);
}
function speedFactor(){ return state.botSpeed==='slow'?1.8:(state.botSpeed==='fast'?0.45:1); }
function scheduleEngine(){
  const delay=(15000+Math.random()*10000)*speedFactor()+(state.settings.powerSaving?20000:0);
  setTimeout(()=>{ try{ engineTick(); }catch(e){ console.error('engine error', e); } scheduleEngine(); }, delay);
}
function presenceTick(){
  activeBots().forEach(b=>{
    if(b.onlineNow){ if(Math.random()<0.4){ b.onlineNow=false; b.lastSeenAt=Date.now(); } }
    else if(Math.random()<0.25){ b.onlineNow=true; }
  });
  if(state.screen==='app'){ const v=curView(); if(v==='chats.chat'||v==='contacts.profile'||v==='chats.groupinfo') render(); }
}
function engineTick(){
  if(state.user.deleted) return;
  presenceTick();
  const botIn=id=>npcActive(id);
  const actions=[];
  const totalBots=Object.values(state.bots).filter(isNpcBot).length;
  const privCount=Object.values(state.chats).filter(c=>c.type==='private').length;
  if(totalBots<14) actions.push({w:3, fn:actSpawnBot});
  if(hiddenBots().length && publicChats().some(c=>((c.members||[]).length)<9)) actions.push({w:3, fn:actBotJoinPublic});
  if(hiddenBots().length && privCount<7) actions.push({w:privCount<2?6:2, fn:actBotDMUser});
  if(activeBots().length>=1) actions.push({w:2, fn:actBotCreatesGroup});
  if(Object.values(state.chats).some(c=>(c.type==='group'||c.type==='channel')&&(c.members||[]).some(botIn))) actions.push({w:2, fn:actBotLeaves});
  const chattyGroups=Object.values(state.chats).filter(c=>c.type==='group' && (c.members||[]).filter(botIn).length>=2);
  if(chattyGroups.length) actions.push({w:5, fn:function(){ return actBotToBotChatter(chattyGroups); }});
  if(Object.values(state.chats).some(c=>c.type==='channel' && (c.admins||[]).some(botIn))) actions.push({w:3, fn:actBotChannelPost});
  if(activeBots().length) actions.push({w:1, fn:actFreezeBot});
  if(activeBots().length) actions.push({w:1, fn:actBotSelfDelete});
  actions.push({w:5, fn:function(){}});
  const totalW=actions.reduce((s,a)=>s+a.w,0);
  let r=Math.random()*totalW;
  for(const a of actions){ if(r<a.w){ const res=a.fn(); if(res&&res.catch) res.catch(e=>console.error('action error',e)); return; } r-=a.w; }
}
function actSpawnBot(){ const b=makeBot(); state.bots[b.id]=b; scheduleSave(); }
function actBotJoinPublic(){
  const hb=hiddenBots(); if(!hb.length) return;
  const pcs=publicChats().filter(c=>((c.members||[]).length)<9);
  if(!pcs.length) return;
  const bot=randOf(hb), chat=randOf(pcs);
  bot.status='active'; markPresence(bot,true); chat.members=chat.members||[]; chat.members.push(bot.id);
  sysNoticeInChat(chat, bot.name+' присоединил(ся/ась) к '+(chat.type==='channel'?'каналу':'группе')+' по ссылке');
  if(state.currentChatId!==chat.id) chat.unread=(chat.unread||0)+1;
  render();
}
let dmPending=false;
async function actBotDMUser(){
  if(dmPending) return;
  const hb=hiddenBots().filter(b=>!state.blocked[b.id]); if(!hb.length) return;
  dmPending=true;
  try{
    const bot=randOf(hb);
    const tmp={id:'tmp', type:'private', peerId:bot.id, messages:[]};
    const text=await generateBotMessage(bot,tmp,{opener:true});
    if(!text || state.user.deleted || bot.status!=='hidden') return;
    bot.status='active'; markPresence(bot,true);
    const chat=newPrivateChat(bot.id);
    chat.messages.push({id:uid('m'), senderId:bot.id, text, time:Date.now()});
    if(!isChatOpen(chat.id)) chat.unread=(chat.unread||0)+1;
    playNotifSound(); render();
    if(state.settings.autoReply){
      setTimeout(()=>{ chat.messages.push({id:uid('m'), senderId:'me', text:state.settings.autoReplyText, time:Date.now(), read:false}); render(); triggerBotReply(chat,bot); }, 2500);
    }
  } finally { dmPending=false; }
}
function actBotCreatesGroup(){
  const ab=activeBots(); if(!ab.length) return;
  const creator=randOf(ab);
  const others=ab.filter(b=>b.id!==creator.id).sort(()=>Math.random()-0.5).slice(0,1+Math.floor(Math.random()*2));
  const id=uid('chat');
  const isPublic=Math.random()<0.5;
  const title=randOf(GROUP_TITLES);
  const isChannel=Math.random()<0.3;
  const chat={ id, type:isChannel?'channel':'group', title,
    members:['me', creator.id, ...others.map(o=>o.id)], admins:[creator.id], creatorId:creator.id,
    isPublic, link:isPublic?'nebulagram.me/'+translit(title).replace(/[^a-z0-9]/g,'').slice(0,10)+Math.floor(Math.random()*90):null,
    messages:[], mutedUntil:0, unread:1 };
  state.chats[id]=chat; markPresence(creator,true);
  sysNoticeInChat(chat, creator.name+' создал(а) '+(isChannel?'канал':'группу')+' «'+title+'»');
  sysNoticeInChat(chat, creator.name+' пригласил(а) вас');
  render();
}
function actBotLeaves(){
  const candidates=Object.values(state.chats).filter(c=>(c.type==='group'||c.type==='channel')&&(c.members||[]).some(id=>npcActive(id)));
  if(!candidates.length) return;
  const chat=randOf(candidates);
  const botIds=chat.members.filter(id=>npcActive(id));
  if(!botIds.length) return;
  const bid=randOf(botIds);
  chat.members=chat.members.filter(m=>m!==bid);
  chat.admins=(chat.admins||[]).filter(a=>a!==bid);
  sysNoticeInChat(chat, state.bots[bid].name+' покинул(а) '+(chat.type==='channel'?'канал':'группу'));
  render();
}
async function actBotChannelPost(){
  const chs=Object.values(state.chats).filter(c=>c.type==='channel' && (c.admins||[]).some(a=>npcActive(a)));
  if(!chs.length) return;
  const c=randOf(chs);
  const bot=state.bots[randOf(c.admins.filter(a=>npcActive(a)))];
  const text=await generateBotMessage(bot,c,{channelPost:true});
  if(!text || !state.chats[c.id]) return;
  c.messages.push({id:uid('m'), senderId:bot.id, text, time:Date.now()});
  markPresence(bot,true);
  if(!isChatOpen(c.id)) c.unread=(c.unread||0)+1;
  playNotifSound(); render();
}
async function actBotToBotChatter(groups){
  const chat=randOf(groups);
  const botIds=chat.members.filter(id=>npcActive(id));
  if(botIds.length<2) return;
  const order=botIds.slice().sort(()=>Math.random()-0.5);
  const rounds=2+Math.floor(Math.random()*2);
  for(let i=0;i<rounds;i++){
    const bot=state.bots[order[i%order.length]];
    if(!bot||bot.status!=='active'||!state.chats[chat.id]||!chat.members.includes(bot.id)) break;
    typingChats[chat.id]=bot.id; if(isChatOpen(chat.id)) render();
    const text=await generateBotMessage(bot,chat);
    delete typingChats[chat.id];
    if(!text){ render(); break; }
    if(!state.chats[chat.id] || !chat.members.includes(bot.id)) break;
    chat.messages.push({id:uid('m'), senderId:bot.id, text, time:Date.now()});
    markPresence(bot,true);
    if(!isChatOpen(chat.id)) chat.unread=(chat.unread||0)+1;
    render(); playNotifSound();
    await sleep(1500+Math.random()*2500);
  }
}
function actFreezeBot(){
  const ab=activeBots(); if(!ab.length || Math.random()>0.35) return;
  const bot=randOf(ab);
  bot.status='frozen';
  sysNotice('Аккаунт '+bot.name+' был заморожен за подозрение в спам-активности.','snowflake');
  render();
}
function actBotSelfDelete(){
  const ab=activeBots(); if(!ab.length || Math.random()>0.3) return;
  const bot=randOf(ab);
  bot.status='deleted';
  sysNotice('Пользователь '+bot.name+' удалил(а) свой аккаунт.','block');
  render();
}
function playNotifSound(){
  if(!state.settings.notifSound) return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=880; g.gain.value=0.05;
    o.connect(g); g.connect(ctx.destination); o.start();
    setTimeout(()=>{ o.stop(); ctx.close(); }, 120);
  }catch(e){}
}

/* ===================== BOTS: BotMother + user bots ===================== */
function botMotherObj(){ return { id:'botmother', name:'BotMother', username:'BotMother', isSystemBot:true, bio:'Официальный бот NebulaGram. Создаёт и настраивает ИИ-ботов.', color:'#3d8fd9', avatar:null, status:'active', createdAt:Date.now(), onlineNow:true, lastSeenAt:Date.now() }; }
function ensureBotMother(){ if(!state.bots.botmother) state.bots.botmother=botMotherObj(); }
function isNpcBot(b){ return !!b && !b.isSystemBot && !b.isUserBot; }
function npcActive(id){ const b=state.bots[id]; return !!b && b.status==='active' && !b.isSystemBot && !b.isUserBot; }
function pickableBots(){ return Object.values(state.bots).filter(b=>b.status==='active' && !b.isSystemBot); }
function myBots(){ return Object.values(state.bots).filter(b=>b.isUserBot); }
const BM_MENU=[[{t:'Создать бота',cb:'bm:new'},{t:'Мои боты',cb:'bm:list'}],[{t:'Помощь',cb:'bm:help'}]];
function genToken(){ const a='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-'; let t=''; for(let i=0;i<35;i++) t+=a[Math.floor(Math.random()*a.length)]; return Math.floor(1e8+Math.random()*9e8)+':'+t; }
function fillTpl(t,bot,args){ return String(t||'').replace(/\{name\}/g,state.user.name||'друг').replace(/\{bot\}/g,bot.name).replace(/\{time\}/g,new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})).replace(/\{args\}/g,args||''); }
function parseCmd(txt,bot){
  const mm=/^\/([a-zA-Z0-9_]+)(?:@(\w+))?(?:\s+([\s\S]*))?$/.exec(String(txt||'').trim());
  if(!mm) return null;
  if(mm[2] && mm[2].toLowerCase()!==String(bot.username).toLowerCase()) return null;
  return {name:mm[1].toLowerCase(), args:mm[2]===undefined?(mm[3]||''):(mm[3]||'')};
}
async function botSay(chat,bot,text,buttons,delay){
  typingChats[chat.id]=bot.id; if(isChatOpen(chat.id)) render();
  await sleep(delay==null?400+Math.min(900,text.length*7):delay);
  delete typingChats[chat.id];
  if(!state.chats[chat.id]) return;
  markRead(chat);
  chat.messages.push({id:uid('m'), senderId:bot.id, text, buttons:buttons||undefined, time:Date.now()});
  if(!isChatOpen(chat.id)) chat.unread=(chat.unread||0)+1;
  playNotifSound(); render();
}
function openBotChat(id){
  const bot=state.bots[id]; if(!bot) return;
  const c=newPrivateChat(id); c.unread=0;
  state.currentChatId=c.id; state.activeTab='chats'; state.stack=['chats.list','chats.chat']; state._chatFilter=''; state._forceBottom=true;
  if(!c.messages.length){
    if(bot.isSystemBot) bmGreeting(c);
    else if(bot.isUserBot) sysNoticeInChat(c,'Это бот. Напишите /start или любое сообщение, чтобы начать.','bot');
  }
  render();
}
function openBotMother(){ openBotChat('botmother'); }
function bmOpenBot(id){ openBotChat('botmother'); const c=newPrivateChat('botmother'); bmBotMenu(c,state.bots[id]); }
function bmGreeting(chat){ return botSay(chat,state.bots.botmother,'Привет! Я BotMother, официальный бот NebulaGram. Я помогу создать ИИ-бота и запрограммировать его: задать характер (промпт), приветствие и собственные команды.\n\nЧто делаем?',BM_MENU); }
function bmHelp(chat){ return botSay(chat,state.bots.botmother,'Как это работает:\n1. /newbot: задайте имя и username (он должен заканчиваться на bot).\n2. Опишите промптом, кто ваш бот и как он говорит.\n3. Добавьте команды с готовыми ответами. В ответах работают {name}, {bot}, {time}, {args}.\n4. Найдите бота через поиск по @username или добавьте его в группу. В группе он отвечает, когда его упомянули через @username, ответили на его сообщение или вызвали его команду.\n\nВсе остальные сообщения бот обдумывает через ИИ по вашему промпту (провайдер: Настройки → ИИ ботов).\n\nКоманды: /newbot, /mybots, /cancel',BM_MENU); }
function bmBotMenu(chat,bot){
  if(!bot) return botSay(chat,state.bots.botmother,'Бот не найден.',BM_MENU);
  const id=bot.id;
  const pr=bot.prompt?(bot.prompt.length>160?bot.prompt.slice(0,160)+'...':bot.prompt):'не задан';
  const txt='Бот «'+bot.name+'» (@'+bot.username+')\nРежим: '+(bot.mode==='commands'?'только команды':'ИИ отвечает на любые сообщения')+'\nКоманд: '+Object.keys(bot.commands||{}).length+'\nПромпт: '+pr;
  return botSay(chat,state.bots.botmother,txt,[
    [{t:'Промпт',cb:'bm:prompt:'+id},{t:'Приветствие',cb:'bm:welcome:'+id}],
    [{t:'Команды',cb:'bm:cmds:'+id},{t:'Имя',cb:'bm:rename:'+id}],
    [{t:'Описание',cb:'bm:desc:'+id},{t:'Режим',cb:'bm:mode:'+id}],
    [{t:'Токен',cb:'bm:token:'+id},{t:'Удалить',cb:'bm:del:'+id}],
    [{t:'Открыть бота',cb:'bm:open:'+id}],[{t:'К списку',cb:'bm:list'}]]);
}
function bmCmdsView(chat,bot){
  const cmds=Object.keys(bot.commands||{});
  const txt='Команды бота @'+bot.username+':\n'+(cmds.length?cmds.map(c=>'/'+c+' → '+(bot.commands[c].length>50?bot.commands[c].slice(0,50)+'...':bot.commands[c])).join('\n'):'пока нет')+'\n\nВстроенные: /start (приветствие) и /help.';
  const rows=[[{t:'Добавить команду',cb:'bm:addcmd:'+bot.id}]];
  cmds.slice(0,10).forEach(c=>rows.push([{t:'Удалить /'+c,cb:'bm:delcmd:'+bot.id+':'+c}]));
  rows.push([{t:'Назад',cb:'bm:bot:'+bot.id}]);
  return botSay(chat,state.bots.botmother,txt,rows);
}
async function bmCallback(chat,cb){
  const p=cb.split(':'); const act=p[1], id=p[2];
  const bm=state.bots.botmother;
  state.bmFlow=null;
  let bot=null;
  if(id){ bot=state.bots[id]; if(!bot||!bot.isUserBot) return botSay(chat,bm,'Бот не найден.',BM_MENU); }

  switch(act){

    case 'cancel': return botSay(chat,bm,'Отменено.',BM_MENU);
    case 'help': return bmHelp(chat);
    case 'list': {
      const list=myBots();
      if(!list.length) return botSay(chat,bm,'У вас пока нет ботов.',[[{t:'Создать бота',cb:'bm:new'}]]);
