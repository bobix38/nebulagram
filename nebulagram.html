    }
    case 'bot': return bmBotMenu(chat,bot);
    case 'skip': return bmBotMenu(chat,bot);
    case 'prompt': state.bmFlow={step:'prompt',botId:id}; return botSay(chat,bm,'Текущий промпт:\n'+(bot.prompt||'не задан')+'\n\nОтправьте новый: кто этот бот, его характер, стиль речи, что умеет и чего не делает. Например: «Ты бариста Марк. Любишь кофе и книги, отвечаешь тепло и коротко, советуешь напитки».',cancelRow);
    case 'welcome': state.bmFlow={step:'welcome',botId:id}; return botSay(chat,bm,'Приветствие на /start сейчас: '+(bot.welcome||'стандартное')+'\n\nОтправьте новый текст (можно {name}) или дефис, чтобы сбросить.',cancelRow);
    case 'rename': state.bmFlow={step:'rename',botId:id}; return botSay(chat,bm,'Отправьте новое имя бота.',cancelRow);
    case 'desc': state.bmFlow={step:'desc',botId:id}; return botSay(chat,bm,'Отправьте короткое описание бота (видно в его профиле).',cancelRow);
    case 'cmds': return bmCmdsView(chat,bot);
    case 'addcmd': state.bmFlow={step:'cmdname',botId:id}; return botSay(chat,bm,'Как назвать команду? Например: menu (получится /menu).',[[{t:'Отмена',cb:'bm:cmds:'+id}]]);
    case 'delcmd': if(bot.commands) delete bot.commands[p[3]]; return bmCmdsView(chat,bot);
    case 'mode': bot.mode=bot.mode==='commands'?'ai':'commands'; return botSay(chat,bm,'Режим: '+(bot.mode==='commands'?'только команды (бот не отвечает на остальные сообщения)':'ИИ отвечает на любые сообщения по промпту')+'.',[[{t:'Назад',cb:'bm:bot:'+id}]]);
    case 'token': return botSay(chat,bm,'Токен бота @'+bot.username+':\n'+bot.token+'\n\nНикому его не показывайте.',[[{t:'Копировать',cb:'bm:copy:'+id}],[{t:'Назад',cb:'bm:bot:'+id}]]);
    case 'copy': copyText(bot.token); return;
    case 'del': return botSay(chat,bm,'Удалить бота @'+bot.username+'? Его чаты и участие в группах пропадут.',[[{t:'Да, удалить',cb:'bm:delok:'+id},{t:'Отмена',cb:'bm:bot:'+id}]]);
    case 'delok': deleteUserBot(id); return botSay(chat,bm,'Бот удалён.',BM_MENU);
    case 'open': openBotChat(id); return;
  }
}
function deleteUserBot(id){

  });
}
async function bmHandleText(chat,text){
  const bm=state.bots.botmother;
  const t=(text||'').trim();
  if(!t) return botSay(chat,bm,'Я понимаю только текст. Используйте кнопки или /help.',BM_MENU);
  const low=t.toLowerCase();
  if(low==='/cancel'){ state.bmFlow=null; return botSay(chat,bm,'Отменено.',BM_MENU); }
  if(low==='/start'){ state.bmFlow=null; return bmGreeting(chat); }
  if(low==='/help') return bmHelp(chat);
  if(low==='/newbot') return bmCallback(chat,'bm:new');
  if(low==='/mybots') return bmCallback(chat,'bm:list');
  const f=state.bmFlow;
  if(!f) return botSay(chat,bm,'Не понял. Выберите действие:',BM_MENU);
  const bot=f.botId?state.bots[f.botId]:null;
  if(f.botId && (!bot||!bot.isUserBot)){ state.bmFlow=null; return botSay(chat,bm,'Бот не найден.',BM_MENU); }
  switch(f.step){
    case 'name':
      if(t.length>40) return botSay(chat,bm,'Слишком длинное имя (максимум 40 символов). Попробуйте короче.');
      f.name=t; f.step='username';
      return botSay(chat,bm,'Отлично. Теперь придумайте username. Он должен заканчиваться на bot, например: coffee_bot.');
    case 'username': {
      const u=t.replace(/^@/,'');
      if(!/^[A-Za-z][A-Za-z0-9_]{2,29}$/.test(u) || !/bot$/i.test(u)) return botSay(chat,bm,'Username: латиница, цифры и _, от 3 до 30 символов, оканчивается на bot. Попробуйте ещё раз.');
      const taken=Object.values(state.bots).some(b=>String(b.username||'').toLowerCase()===u.toLowerCase());
      if(taken) return botSay(chat,bm,'Этот username уже занят. Придумайте другой.');
      const id=uid('bot');
      state.bots[id]={id, name:f.name, username:u, isUserBot:true, owner:'me', token:genToken(), prompt:'', welcome:'', commands:{}, mode:'ai', bio:'', color:randOf(AVATAR_COLORS), avatar:null, status:'active', createdAt:Date.now(), onlineNow:true, lastSeenAt:Date.now()};
      state.bmFlow={step:'prompt',botId:id};
      await botSay(chat,bm,'Готово! Бот «'+f.name+'» создан: nebulagram.me/'+u+'\n\nТокен:\n'+state.bots[id].token,[[{t:'Открыть бота',cb:'bm:open:'+id}]]);
      return botSay(chat,bm,'Теперь запрограммируйте его: отправьте промпт, кто этот бот и как он говорит. Например: «Ты бариста Марк, любишь кофе и книги, отвечаешь тепло и коротко».',[[{t:'Пропустить',cb:'bm:skip:'+id}]]);
    }
    case 'prompt': bot.prompt=t.slice(0,2000); state.bmFlow=null; await botSay(chat,bm,'Промпт сохранён. Бот уже отвечает по нему. Проверьте: откройте бота и напишите ему.'); return bmBotMenu(chat,bot);
    case 'welcome': bot.welcome=(t==='-')?'':t.slice(0,1000); state.bmFlow=null; await botSay(chat,bm,t==='-'?'Приветствие сброшено.':'Приветствие сохранено.'); return bmBotMenu(chat,bot);
    case 'rename': if(t.length>40) return botSay(chat,bm,'Слишком длинное имя, максимум 40 символов.'); bot.name=t; state.bmFlow=null; await botSay(chat,bm,'Имя изменено.'); return bmBotMenu(chat,bot);
    case 'desc': bot.bio=t.slice(0,140); state.bmFlow=null; await botSay(chat,bm,'Описание сохранено.'); return bmBotMenu(chat,bot);
    case 'cmdname': {
      const n=t.replace(/^\//,'').toLowerCase();
      if(!/^[a-z][a-z0-9_]{0,31}$/.test(n)) return botSay(chat,bm,'Команда: латиница, цифры и _, начинается с буквы.');
      if(n==='start'||n==='help') return botSay(chat,bm,'/start и /help встроенные. Приветствие меняется отдельной кнопкой. Выберите другое имя.');
      f.cmd=n; f.step='cmdreply';
      return botSay(chat,bm,'Что бот ответит на /'+n+'? Отправьте текст ответа (можно {name}, {bot}, {time}, {args}).');
    }
    case 'cmdreply': { bot.commands=bot.commands||{}; bot.commands[f.cmd]=t.slice(0,1000); state.bmFlow=null; await botSay(chat,bm,'Команда /'+f.cmd+' добавлена.'); return bmCmdsView(chat,bot); }
  }
}
async function userBotRespond(chat,bot,m){
  const txt=((m&&m.text)||'').trim();
  const cmd=parseCmd(txt,bot);
  const cmds=Object.keys(bot.commands||{}).map(c=>'/'+c);
  if(cmd){
    if(cmd.name==='start') return botSay(chat,bot,bot.welcome?fillTpl(bot.welcome,bot,cmd.args):'Привет, '+(state.user.name||'друг')+'! Я '+bot.name+'.'+(bot.mode==='commands'&&cmds.length?' Мои команды: '+cmds.join(', '):' Напишите мне что-нибудь.'));
    if(bot.commands && bot.commands[cmd.name]) return botSay(chat,bot,fillTpl(bot.commands[cmd.name],bot,cmd.args));
    if(cmd.name==='help') return botSay(chat,bot,(bot.bio?bot.bio+'\n\n':'')+'Команды: '+['/start'].concat(cmds).join(', '));
    if(bot.mode==='commands') return botSay(chat,bot,'Неизвестная команда. Доступные: '+['/start','/help'].concat(cmds).join(', '));
  }
  if(bot.mode==='commands') return botSay(chat,bot,'Я понимаю только команды: '+['/start','/help'].concat(cmds).join(', '));
  return triggerBotReply(chat,bot);
}

function providerName(){ return state.aiProvider==='gemini'?'Gemini':'Claude'; }
function maskKey(k){ return k ? k.slice(0,6)+'...'+k.slice(-4) : ''; }
async function callAI(system,messages,maxTokens){
  return state.aiProvider==='gemini' ? callGemini(system,messages,maxTokens) : callClaudeApi(system,messages,maxTokens);
}
async function callGemini(system,messages,maxTokens){
  if(!state.geminiKey){ state.aiError='Не задан ключ Gemini'; throw new Error(state.aiError); }
  const model=state.geminiModel||'gemini-2.5-flash';
  const contents=messages.map(m=>({role:m.role==='assistant'?'model':'user', parts:(typeof m.content==='string'?[{text:m.content}]:m.content.map(b=>b.type==='image'?{inlineData:{mimeType:b.source.media_type,data:b.source.data}}:{text:b.text}))}));
  const body={systemInstruction:{parts:[{text:system}]}, contents, generationConfig:{maxOutputTokens:maxTokens||220, temperature:1}};
  if(/2\.5-flash/.test(model)) body.generationConfig.thinkingConfig={thinkingBudget:0};
  let resp;
  try{
    resp=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':state.geminiKey},body:JSON.stringify(body)});
  }catch(e){ state.aiError='Сеть или доступ заблокирован'; throw e; }
  if(!resp.ok){
    let d=''; try{ const j=await resp.json(); d=(j.error&&j.error.message)||''; }catch(e){}
    state.aiError='Gemini HTTP '+resp.status+(d?': '+d.slice(0,120):'');
    throw new Error(state.aiError);
  }
  const data=await resp.json();
  const cand=data.candidates&&data.candidates[0];
  const t=((cand&&cand.content&&cand.content.parts)||[]).map(p=>p.text||'').join(' ').trim();
  if(!t){ state.aiError='Gemini не вернул текст'+(cand&&cand.finishReason?' ('+cand.finishReason+')':''); throw new Error(state.aiError); }
  return t;
}

/* ===================== PERSISTENCE ===================== */
let lastSaveMode='', saveWarned=false;
function stateJson(){ state._savedAt=Date.now(); return JSON.stringify(state); }
function idbOpen(){ return new Promise((res,rej)=>{ if(!window.indexedDB) return rej(new Error('no idb')); let r; try{ r=indexedDB.open('nebulagram',1); }catch(e){ return rej(e); } r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbSet(k,v){ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>{ db.close(); res(); }; tx.onerror=()=>rej(tx.error); }); }
async function idbGet(k){ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction('kv','readonly'); const q=tx.objectStore('kv').get(k); q.onsuccess=()=>{ db.close(); res(q.result); }; q.onerror=()=>rej(q.error); }); }
async function saveNow(){
  const json=stateJson(); const modes=[];
  try{ localStorage.setItem('ng_state',json); modes.push('браузер'); }catch(e){}
  try{ if(window.storage){ await window.storage.set('ng_state',json,false); modes.push('Claude'); } }catch(e){}
  try{ await idbSet('ng_state',json); modes.push('IndexedDB'); }catch(e){}
  lastSaveMode=modes.join(' + ');
  if(!modes.length && !saveWarned){ saveWarned=true; toast('Браузер не даёт сохранять данные. Сделайте копию: Настройки → Данные и память'); }
}
function flushSync(){ try{ localStorage.setItem('ng_state',stateJson()); }catch(e){} try{ idbSet('ng_state',stateJson()); }catch(e){} }
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,500); }

function importBackup(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const o=JSON.parse(r.result); if(!o||typeof o!=='object'||!o.user||!o.chats) throw new Error('bad'); state=Object.assign(defaultState(),o); state.aiStatus='unknown'; typingChats={}; ensureBotMother(); saveNow(); if(state.screen==='app') bootEngine(); render(); toast('Данные восстановлены'); }catch(e){ toast('Файл повреждён'); } };
    r.readAsText(f); };
  inp.click();
}
async function initApp(){
  const cands=[];
  try{ if(window.storage){ const r=await window.storage.get('ng_state',false); if(r&&r.value) cands.push(r.value); } }catch(e){}
  try{ const v=localStorage.getItem('ng_state'); if(v) cands.push(v); }catch(e){}
  try{ const v=await idbGet('ng_state'); if(v) cands.push(v); }catch(e){}
  let best=null, bestT=-1;
  cands.forEach(raw=>{ try{ const o=JSON.parse(raw); const t=o._savedAt||0; if(t>bestT){ best=o; bestT=t; } }catch(e){} });
  if(best){ state=Object.assign(defaultState(),best); typingChats={}; state.aiStatus='unknown'; state.replyTo=null; }
  ensureBotMother();
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  render();
  if(state.screen==='app') bootEngine();
}
initApp();
</script>
